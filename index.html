<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektboard Concept Art</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: feste Kopfzeile mit Ansichts-Tabs, darunter je Ansicht eine Werkzeugleiste und die Arbeitsfläche (Kachelraster / Wochenspalten / Tageszeitstrahl). */
:root{
  --bg:#eaefee;
  --surface:#ffffff;
  --surface-2:#f4f7f6;
  --ink:#13201d;
  --muted:#586a66;
  --line:#d3dcd9;
  --accent:#0d6b61;
  --accent-ink:#ffffff;
  --accent-soft:#d5ebe6;
  --ok:#157a3d;
  --warn:#a85a07;
  --bad:#b42121;
  --shadow:0 1px 2px rgba(16,32,29,.06),0 4px 14px rgba(16,32,29,.06);
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --surface-2:#1c2928; --ink:#e4edeb; --muted:#93a6a1;
    --line:#2a3a37; --accent:#45bba9; --accent-ink:#04201b; --accent-soft:#163a34;
    --ok:#4ade80; --warn:#f2a33a; --bad:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1c2928; --ink:#e4edeb; --muted:#93a6a1;
  --line:#2a3a37; --accent:#45bba9; --accent-ink:#04201b; --accent-soft:#163a34;
  --ok:#4ade80; --warn:#f2a33a; --bad:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(16px,3vw);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:22px}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-state="live"]::before{background:var(--ok)}
.sync[data-state="stale"]::before,.sync[data-state="connecting"]::before{background:var(--warn)}
.sync[data-state="off"]::before,.sync[data-state="error"]::before{background:var(--bad)}
.me{display:flex;align-items:center;gap:8px;font-size:13.5px}

.banner{margin:12px max(16px,3vw) 0;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--line);font-size:14px}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));}

main{padding:16px max(16px,3vw) 48px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1 1 200px}
.field{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
input[type="search"],input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;color:var(--ink)}
input[type="search"]{width:100%;max-width:340px}
textarea{width:100%;resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;min-height:36px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icon-btn:hover{border-color:var(--line);color:var(--ink);background:var(--surface-2)}
.icon-btn svg,.btn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13.5px;color:var(--muted);min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* Kennzahlen */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.stat b{font-family:var(--font-mono);font-weight:500;font-size:14px;color:var(--ink)}

/* Kacheln */
.grid{--tile-min:290px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr));gap:14px;align-items:start}
.grid[data-density="s"]{--tile-min:230px}
.grid[data-density="l"]{--tile-min:360px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tile-head,.tile-meta{background:var(--c,var(--accent));color:#fff}
.tile-head{padding-top:14px}
.tile-meta{padding-bottom:12px}
.tile .client{color:rgba(255,255,255,.85)}
.tile .grip,.tile:hover .grip{color:rgba(255,255,255,.75)}
.tile-head .icon-btn{color:#fff}
.tile-head .icon-btn:hover{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.tile-meta .pill{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.tile-meta button.pill:hover{background:rgba(255,255,255,.32);border-color:transparent}
.tile-meta .pill::before{background:#fff}
.tile-meta .chip.overdue{background:#fff;color:var(--bad)}
.tile-meta .chip.soon{background:#fff;color:#a85a07}
.tile-meta .av{border-color:#fff}
.tile .notes{border-top:0}
.tile.on-light .tile-head,.tile.on-light .tile-meta{color:#13201d}
.tile.on-light .grip,.tile.on-light:hover .grip{color:rgba(19,32,29,.55)}
.tile.on-light .tile-head .icon-btn{color:#13201d}
.tile.on-light .tile-head .icon-btn:hover{background:rgba(0,0,0,.08);color:#13201d}
.tile.on-light .tile-meta .pill{background:rgba(0,0,0,.09);color:#13201d}
.tile.on-light .tile-meta button.pill:hover{background:rgba(0,0,0,.15)}
.tile.on-light .tile-meta .pill::before{background:#13201d}
.custom-color{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:400;color:var(--ink)}
.custom-color input[type="color"]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.custom-color .hex-input{width:110px;font-family:var(--font-mono);text-transform:lowercase}
.color-preview{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--c);color:#fff;border-radius:10px;padding:12px 14px;font-family:var(--font-display);font-size:17px;font-weight:700}
.color-preview .pill{background:rgba(255,255,255,.2);border-color:transparent;color:#fff;font-family:var(--font-body)}
.color-preview.on-light{color:#13201d}
.color-preview.on-light .pill{background:rgba(0,0,0,.09);color:#13201d}
.tile :focus-visible{outline-color:currentColor}
.tile.size-l{grid-column:span 2}
.tile.is-done{opacity:.72}
.tile.is-done h3{text-decoration:line-through;text-decoration-thickness:1px}
.tile-head{display:flex;align-items:flex-start;gap:8px;padding:12px 10px 6px 12px;cursor:grab;user-select:none}
.readonly .tile-head{cursor:default}
.tile-head:active{cursor:grabbing}
.grip{color:var(--line);margin-top:2px;flex:none}
.grip svg{width:14px;height:18px}
.tile:hover .grip{color:var(--muted)}
.tile-titles{flex:1;min-width:0}
.tile h3{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.client{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tile-actions{display:flex;gap:2px;flex:none}
.tile-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 12px 10px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
button.pill:hover{border-color:var(--accent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.chip::before{display:none}
.st-offen{color:var(--muted)}
.st-arbeit{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.st-wartet{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--surface));border-color:transparent}
.st-erledigt{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:transparent}
.chip.overdue{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.chip.soon{color:var(--warn)}
.chip.hours{font-family:var(--font-mono);font-weight:500}
.avatars{display:flex;margin-left:auto}
.avatars .av+.av{margin-left:-6px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c,var(--muted));color:#fff;font-size:10.5px;font-weight:600;border:2px solid var(--surface);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:20px;height:20px;font-size:9px;border-width:1.5px}

.notes{list-style:none;margin:0;padding:0 8px;display:grid;gap:1px;border-top:1px solid var(--line)}
.tile.size-l .jobs{grid-template-columns:1fr 1fr;column-gap:0}
.tile.size-l .job:nth-child(odd){border-right:1px solid var(--line)}
.jobs{display:grid}
.jobs:empty::before{content:"Noch keine Jobs. Unten einen anlegen.";display:block;padding:14px 12px;color:var(--muted);font-size:13.5px}
.jobs[data-empty="filtered"]:empty::before{content:"Kein Job passt zum Filter."}
.job{border-bottom:1px solid var(--line);padding:9px 0 2px;min-width:0}
.job-head{display:flex;align-items:center;gap:6px;padding:0 6px 0 8px}
.job-grip{color:var(--line);cursor:grab;display:inline-flex;flex:none}
.job:hover .job-grip{color:var(--muted)}
.job-grip svg{width:12px;height:16px}
.job-title{flex:1;min-width:0;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.job.is-done .job-title{text-decoration:line-through;color:var(--muted)}
.job-actions{display:flex;flex:none}
.job-actions .icon-btn{width:26px;height:26px}
.job-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:5px 10px 4px 26px}
.job-meta:empty{display:none}
.job .notes{padding:0 8px 0 20px;border-top:0}
.job .note{padding:4px 4px}
.job .note-add{border-top:0;padding:2px 10px 8px 26px;margin-top:0}
.job .note-add input{min-height:30px;padding:5px 9px;font-size:13.5px}
.job .more{padding-left:26px}
.done-toggle{border-bottom:1px solid var(--line);padding:6px 12px}
.job-add{display:flex;gap:6px;padding:9px 10px 10px;background:var(--surface-2);margin-top:auto}
.job-add input{flex:1;min-width:0;border:1px dashed var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:34px;font-weight:500}
.job-add input:focus{border-style:solid;border-color:var(--accent);outline:none}
.pal-client{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px;padding-left:8px;border-left:3px solid var(--c)}
.pal-client:first-child{margin-top:0}
.slot-client{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);overflow-wrap:anywhere;line-height:1.3}
.note{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:start;padding:6px 4px;border-bottom:1px dashed var(--line)}
.note:last-child{border-bottom:0}
.chk{width:18px;height:18px;margin-top:2px;border:1.5px solid var(--muted);border-radius:5px;background:transparent;padding:0;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:12px;height:12px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;cursor:text;border-radius:4px;padding:0 2px}
.note .txt[contenteditable]{outline:2px solid var(--accent);background:var(--surface-2)}
.note.done .txt{color:var(--muted);text-decoration:line-through}
.note .by{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.note .del{opacity:0;width:24px;height:24px}
.note:hover .del,.note:focus-within .del{opacity:1}
.more{border:0;background:transparent;color:var(--accent);font-size:13px;padding:4px 12px 6px;text-align:left;font-weight:500}
.note-add{display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line);margin-top:auto}
.note-add input{flex:1;min-width:0;border:1px solid transparent;background:var(--surface-2);border-radius:8px;padding:7px 10px;min-height:34px}
.note-add input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.note-add button{flex:none}
.notes:empty{display:none}

.tile-ghost{opacity:.35}
.tile-chosen{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{color:var(--ink);font-size:20px}

/* Woche */
.week-layout{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.palette{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:calc(100vh - 100px);overflow:auto}
.palette h4,.side h4{font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.palette-list{display:grid;gap:6px}
.pchip{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;background:var(--surface-2);font-size:13.5px;cursor:grab;user-select:none}
.readonly .pchip{cursor:default}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weekgrid-wrap{overflow-x:auto}
.weekgrid{display:grid;gap:10px;min-width:min-content}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:320px;min-width:150px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.weekend{background:var(--surface-2)}
.day-head{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.day-head .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day-head h4{font-size:15px}
.day-head .date{color:var(--muted);font-size:12.5px;font-weight:400;font-family:var(--font-body)}
.day-head .sum{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.load{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.load i{display:block;height:100%;background:var(--accent);border-radius:3px}
.load.over i{background:var(--bad)}
.day-link{border:0;background:none;padding:0;text-align:left}
.day-link:hover h4{color:var(--accent)}
.slots{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px;min-height:80px}
.slot{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:7px 8px;font-size:13px;cursor:grab;display:grid;gap:3px;box-shadow:var(--shadow)}
.readonly .slot{cursor:pointer}
.slot-title{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.slot-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.slot-meta .num{color:var(--ink)}
.slot-note{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.slot-hrs{display:flex;gap:4px;margin-left:auto}
.slot-hrs button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;line-height:1;padding:0}
.add-slot{margin:0 8px 8px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px;color:var(--muted);font-size:13px}
.add-slot:hover{border-color:var(--accent);color:var(--accent)}
.slots .pchip{border-style:dashed}

/* Tag */
.day-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.timeline-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.untimed{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.untimed .lbl{font-size:12.5px;color:var(--muted);margin-right:4px}
.untimed .slot{min-width:180px}
.timeline{position:relative;display:grid;grid-template-columns:56px 1fr}
.hours-col div{height:var(--ph);font-family:var(--font-mono);font-size:11.5px;color:var(--muted);padding:2px 8px 0;text-align:right;border-top:1px solid var(--line)}
.lane-area{position:relative;border-left:1px solid var(--line);cursor:copy}
.readonly .lane-area{cursor:default}
.lane-area .hr{height:var(--ph);border-top:1px solid var(--line)}
.lane-area .hr::after{content:"";display:block;height:50%;border-bottom:1px dotted color-mix(in srgb,var(--line) 70%,transparent)}
.block{position:absolute;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));padding:5px 8px;font-size:12.5px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.block .slot-title{font-size:13px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.todo-proj{border-left:4px solid var(--c);padding-left:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.todo-proj h5{font-family:var(--font-display);font-size:14.5px;margin:0;display:flex;justify-content:space-between;gap:8px}
.todo-proj h5 .num{font-size:12px;color:var(--muted);font-weight:500}
.todo-proj .notes{border-top:0;padding:0}
.todo-proj .note-add{padding:4px 0 0;border-top:0}

/* Dialog */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.modal-card h2{font-size:20px}
.form{display:grid;gap:12px}
.form .lbl{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.form .lbl .seg{justify-self:start}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form input,.form select{width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.modal-actions .left{margin-right:auto}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 3px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface-2)}
.person button{border:0;background:transparent;width:20px;height:20px;border-radius:50%;color:var(--muted);padding:0}
.picker{position:relative}
.picker-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:5;max-height:220px;overflow:auto}
.picker-list button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 10px;text-align:left;font-size:13.5px}
.picker-list button:hover,.picker-list button:focus-visible{background:var(--surface-2)}
.picker-list .none{padding:8px 10px;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

.readonly .write-only{display:none !important}
.auth{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px;display:grid;gap:18px}
.auth-card .form input{width:100%}
.auth-card h2{font-size:20px}
.auth-brand{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px}
.auth-brand h1{font-size:22px}
.auth-brand span{color:var(--muted);font-size:13px}
.auth-msg{margin:0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.auth-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.auth .btn.primary{justify-content:center}
.auth-open .top,.auth-open main,.auth-open #banner{visibility:hidden}
.invite-list{display:grid;gap:6px}
.invite-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.invite-who{flex:1;min-width:0;display:grid;font-size:13.5px;color:var(--ink);font-weight:400}
.invite-who span{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}

@media (max-width:860px){
  .week-layout,.day-layout{grid-template-columns:1fr}
  .palette{position:static;max-height:none}
  .palette-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (max-width:640px){
  .tile.size-l{grid-column:span 1}
  .tile.size-l .jobs{grid-template-columns:1fr}
  .tile.size-l .job:nth-child(odd){border-right:0}
  .brand span{display:none}
  .form .row2{grid-template-columns:1fr}
  .note .del{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

<body>
<header class="top">
  <div class="brand"><h1>Projektboard</h1><span>Concept Art Hannover</span></div>
  <nav class="tabs" role="tablist" aria-label="Ansicht">
    <button class="tab" role="tab" data-view="board" id="tab-board">Kacheln</button>
    <button class="tab" role="tab" data-view="week" id="tab-week">Woche</button>
    <button class="tab" role="tab" data-view="day" id="tab-day">Tag</button>
  </nav>
  <span class="sync" id="sync" data-state="connecting">Verbinde …</span>
  <span class="me" id="me"></span>
  <button class="btn" id="team-btn" type="button" hidden>Team</button>
  <button class="btn ghost" id="logout-btn" type="button">Abmelden</button>
</header>
<div class="auth" id="auth" hidden><div class="auth-card" id="auth-card"></div></div>
<div class="banner" id="banner" hidden></div>

<main>
  <!-- KACHELN -->
  <section class="view" id="view-board" aria-labelledby="tab-board">
    <div class="toolbar">
      <input type="search" id="q" class="grow" placeholder="Kunden, Jobs und Notizen durchsuchen" aria-label="Suchen">
      <div class="seg" id="status-filter" role="group" aria-label="Status filtern"></div>
      <label class="field" for="person-board">Person <select id="person-board" class="person-filter"></select></label>
      <label class="check" for="show-done"><input type="checkbox" id="show-done"> Erledigte zeigen</label>
      <div class="seg" id="density" role="group" aria-label="Kachelgröße">
        <button data-d="s" type="button">Kompakt</button><button data-d="m" type="button">Normal</button><button data-d="l" type="button">Groß</button>
      </div>
      <button class="btn primary write-only" id="new-project" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>Neuer Kunde</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid" data-density="m"></div>
    <div class="empty" id="board-empty" hidden></div>
  </section>

  <!-- WOCHE -->
  <section class="view" id="view-week" aria-labelledby="tab-week" hidden>
    <div class="toolbar">
      <button class="icon-btn" id="week-prev" type="button" aria-label="Vorherige Woche"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <h2 id="week-label" style="font-size:18px"></h2>
      <button class="icon-btn" id="week-next" type="button" aria-label="Nächste Woche"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="btn" id="week-today" type="button">Diese Woche</button>
      <span class="grow"></span>
      <label class="field" for="person-week">Person <select id="person-week" class="person-filter"></select></label>
      <label class="check" for="weekend"><input type="checkbox" id="weekend"> Wochenende</label>
    </div>
    <div class="week-layout">
      <aside class="palette write-only" aria-label="Jobs zum Einplanen">
        <h4>Jobs</h4>
        <p class="hint">Job auf einen Tag ziehen, um Zeit einzuplanen. Planungen lassen sich zwischen Tagen verschieben.</p>
        <div class="palette-list" id="palette"></div>
      </aside>
      <div class="weekgrid-wrap"><div class="weekgrid" id="weekgrid"></div></div>
    </div>
  </section>

  <!-- TAG -->
  <section class="view" id="view-day" aria-labelledby="tab-day" hidden>
    <div class="toolbar">
      <button class="icon-btn" id="day-prev" type="button" aria-label="Vorheriger Tag"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <h2 id="day-label" style="font-size:18px"></h2>
      <button class="icon-btn" id="day-next" type="button" aria-label="Nächster Tag"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="btn" id="day-today" type="button">Heute</button>
      <span class="grow"></span>
      <label class="field" for="person-day">Person <select id="person-day" class="person-filter"></select></label>
      <button class="btn primary write-only" id="day-add" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>Zeit einplanen</button>
    </div>
    <div class="day-layout">
      <div class="timeline-card">
        <div class="untimed" id="untimed"></div>
        <div class="timeline" id="timeline"></div>
      </div>
      <aside class="side" id="day-todo" aria-label="Offene Notizen der geplanten Projekte"></aside>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

let migrated = false;
async function migrateClients() {
  if (migrated || !S.isAdmin || !S.canWrite || !S.db) return;
  if (!(S.confirmed && S.confirmed.projects && S.confirmed.clients)) return;
  migrated = true;
  const orphans = [...S.projects.values()].filter(p => !clientOf(p)).sort(byOrder);
  if (!orphans.length) return;
  const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'kunde';
  const groups = new Map();
  for (const p of orphans) {
    const name = (p.client || '').trim() || (p.title || 'Ohne Kunde').trim();
    const key = name.toLowerCase();
    if (!groups.has(key)) groups.set(key, { name, jobs: [] });
    groups.get(key).jobs.push(p);
  }
  let i = 0;
  for (const g of groups.values()) {
    const existing = [...S.clients.values()].find(c => String(c.name).trim().toLowerCase() === g.name.toLowerCase());
    const cid = existing ? existing.id : 'c-' + slug(g.name);
    if (!existing) {
      const body = { name: g.name, color: fixColor(g.jobs[0].color || COLORS[i % COLORS.length]), size: g.jobs.some(j => j.size === 'l') ? 'l' : 'm', order: g.jobs[0].order ?? i * 1000, createdBy: S.me || null, createdAt: Date.now() };
      S.clients.set(cid, { ...body, id: cid });
      const ok = await write('clients/' + cid, () => cDoc(cid).set(body));
      if (!ok) { S.clients.delete(cid); queueRender(); return; }
    }
    let o = 1000;
    for (const j of g.jobs) {
      const patch = { clientId: cid, order: o }; o += 1000;
      S.projects.set(j.id, { ...j, ...patch });
      await write('projects/' + j.id, () => pDoc(j.id).update(patch));
    }
    i++;
  }
  queueRender();
  toast(`${groups.size} Kunden-Kachel${groups.size === 1 ? '' : 'n'} aus deinen Projekten angelegt`);
}

/* Tag */
function renderDay() {
  const d = S.day, key = ymd(d);
  $('#day-label').replaceChildren(`${DAYS_LONG[wdIdx(d)]}, ${d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })}`, h('span', { style: 'color:var(--muted);font-weight:400;font-family:var(--font-body);font-size:14px', text: ` · KW ${isoWeek(d)}` }));
  const list = slotsOn(key);
  const untimed = list.filter(s => toMin(s.start) == null);
  const timed = list.filter(s => toMin(s.start) != null);
  const total = list.reduce((a, s) => a + (Number(s.hours) || 0), 0);

  $('#untimed').replaceChildren(
    h('span', { class: 'lbl' }, h('b', { class: 'num', style: 'color:var(--ink)', text: fmtH(total) }), ' geplant', untimed.length ? ' · ohne Uhrzeit:' : (list.length ? '' : ' · Klick in den Zeitstrahl, um Zeit einzuplanen')),
    ...untimed.map(s => slotCard(s))
  );

  let H0 = 7, H1 = 20;
  for (const s of timed) { const m = toMin(s.start); H0 = Math.min(H0, Math.floor(m / 60)); H1 = Math.max(H1, Math.ceil((m + (Number(s.hours) || 0) * 60) / 60)); }
  H1 = Math.min(H1, 24);
  const PX = 56;
  const tl = $('#timeline'); tl.style.setProperty('--ph', PX + 'px');
  const hoursCol = h('div', { class: 'hours-col' });
  const area = h('div', { class: 'lane-area', 'data-date': key, title: S.canWrite ? 'Klicken, um hier Zeit einzuplanen' : null });
  for (let hr = H0; hr < H1; hr++) { hoursCol.append(h('div', { text: `${pad(hr)}:00` })); area.append(h('div', { class: 'hr' })); }

  // Überschneidungen in Spuren verteilen
  const items = timed.map(s => ({ s, a: toMin(s.start), b: toMin(s.start) + Math.max(15, (Number(s.hours) || 0) * 60) })).sort((x, y) => x.a - y.a);
  const laneEnds = [];
  for (const it of items) { let l = laneEnds.findIndex(e => e <= it.a); if (l < 0) { l = laneEnds.length; laneEnds.push(0); } laneEnds[l] = it.b; it.lane = l; }
  const lanes = Math.max(1, laneEnds.length);
  for (const it of items) {
    const p = proj(it.s.projectId);
    const top = (it.a - H0 * 60) / 60 * PX, height = Math.max(26, (it.b - it.a) / 60 * PX - 3);
    area.append(h('div', { class: 'block', 'data-slot': it.s.id, '--c': jobColor(p), tabindex: '0', role: 'button', 'aria-label': `${clientName(p)}: ${p.title} ab ${it.s.start}, ${fmtH(it.s.hours)} – bearbeiten`,
      style: `top:${top + 1}px;height:${height}px;left:calc(${it.lane / lanes * 100}% + 4px);width:calc(${100 / lanes}% - 8px)` },
      h('div', { class: 'slot-client', text: clientName(p) }),
      h('div', { class: 'slot-title', text: p.title }),
      h('div', { class: 'slot-meta' }, it.s.userId ? avatar(it.s.userId, 'sm') : null, h('span', { class: 'num', text: `${it.s.start}–${fromMin(Math.min(24 * 60, it.b))}` })),
      it.s.note ? h('div', { class: 'slot-note', text: it.s.note }) : null));
  }
  if (key === ymd(today())) {
    const now = new Date(); const m = now.getHours() * 60 + now.getMinutes();
    if (m >= H0 * 60 && m <= H1 * 60) area.append(h('div', { class: 'nowline', style: `top:${(m - H0 * 60) / 60 * PX}px` }));
  }
  tl.replaceChildren(hoursCol, area);

  const todo = $('#day-todo');
  const ae = document.activeElement;
  let refocus = null;
  if (ae && todo.contains(ae)) {
    const f = ae.closest && ae.closest('form.note-add');
    if (f && ae.tagName === 'INPUT') refocus = { pid: f.dataset.project, value: ae.value };
    else { todo.dataset.stale = '1'; return; }
  }
  delete todo.dataset.stale;
  const pids = [...new Set(list.map(s => s.projectId))];
  const blocks = pids.map(pid => {
    const p = proj(pid);
    const hrs = list.filter(s => s.projectId === pid).reduce((a, s) => a + (Number(s.hours) || 0), 0);
    const open = sortNotes(notesOf(pid)).filter(n => !n.done);
    return h('div', { class: 'todo-proj', '--c': jobColor(p) },
      h('div', { class: 'slot-client', text: clientName(p) }),
      h('h5', {}, h('span', { text: p.title }), h('span', { class: 'num', text: fmtH(hrs) })),
      open.length ? h('ul', { class: 'notes' }, open.map(noteItem)) : h('p', { class: 'hint', style: 'margin:2px 0', text: 'Keine offenen Notizen.' }),
      h('form', { class: 'note-add write-only', 'data-project': pid }, h('input', { type: 'text', placeholder: 'Notiz hinzufügen …', 'aria-label': `Notiz zu ${p.title}`, maxlength: '2000', autocomplete: 'off' }), h('button', { class: 'icon-btn', type: 'submit', 'aria-label': 'Notiz speichern' }, svg(ICON.plus))));
  });
  todo.replaceChildren(h('h4', { text: 'Heute zu tun' }), h('p', { class: 'hint', style: 'margin:0', text: 'Offene Notizen der an diesem Tag geplanten Jobs.' }), ...(blocks.length ? blocks : [h('p', { class: 'hint', text: 'Für diesen Tag ist noch nichts geplant.' })]));
  if (refocus) { const inp = $(`form.note-add[data-project="${CSS.escape(refocus.pid)}"] input`, todo); if (inp) { inp.value = refocus.value; inp.focus(); } }
}

/* ---------- Inline-Bearbeitung von Notizen ---------- */
function editNote(span) {
  if (!S.canWrite || span.isContentEditable) return;
  const li = span.closest('[data-note]'); const id = li && li.dataset.note; const n = S.notes.get(id); if (!n) return;
  const original = n.text;
  span.setAttribute('contenteditable', 'plaintext-only');
  if (!span.isContentEditable) span.setAttribute('contenteditable', 'true');
  span.focus();
  const r = document.createRange(); r.selectNodeContents(span); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let cancelled = false;
  const onKey = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); span.blur(); }
    else if (e.key === 'Escape') { cancelled = true; span.textContent = original; span.blur(); }
  };
  const onBlur = () => {
    span.removeEventListener('keydown', onKey); span.removeEventListener('blur', onBlur);
    span.removeAttribute('contenteditable');
    const t = clean(span.textContent).trim();
    if (!cancelled && t && t !== original) updateNote(id, { text: t });
    else { span.textContent = original; queueRender(); }
  };
  span.addEventListener('keydown', onKey); span.addEventListener('blur', onBlur);
}

const AUTH_ERR = {
  'auth/invalid-credential': 'E-Mail oder Passwort stimmt nicht.',
  'auth/wrong-password': 'E-Mail oder Passwort stimmt nicht.',

  'auth/network-request-failed': 'Keine Verbindung. Prüfe das Internet und versuche es erneut.',

const authMsg = e => AUTH_ERR[e && e.code] || 'Das hat nicht geklappt. Bitte noch einmal versuchen.';

// Kleine Hülle, damit der restliche Code Firestore wie bisher anspricht
function makeDb(fs) {
  const wrapErr = e => { const c = (e && e.code) || ''; const map = { 'permission-denied': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', 'unavailable': 'unavailable' }; const err = new Error(e && e.message); err.code = map[c] || c; throw err; };
  const docRef = (col, id) => {
    const r = id ? fsDoc(fs, col, id) : fsDoc(fsCollection(fs, col));
    return {
      id: r.id,
      get: async () => { try { const s = await getDoc(r); return { exists: s.exists(), data: () => s.data() }; } catch (e) { wrapErr(e); } },
      set: d => setDoc(r, d).catch(wrapErr),
      update: d => updateDoc(r, d).catch(wrapErr),
      delete: () => deleteDoc(r).catch(wrapErr)
    };
  };
  return {
    collection: name => ({
      doc: id => docRef(name, id),
      onSnapshot: (next, error) => fsOnSnapshot(fsCollection(fs, name), { includeMetadataChanges: true },
        snap => next({ docs: snap.docs.map(d => ({ id: d.id, data: () => d.data() })), metadata: { fromCache: snap.metadata.fromCache } }),
        e => error && error({ code: e.code === 'permission-denied' ? 'revoked' : e.code, message: e.message }))
    })
  };
}

const COLOR_POOL = ['#0d7a6e', '#2563eb', '#7c3aed', '#c0267a', '#e0561b', '#a07c05', '#2f9a48', '#55636b'];
const colorFor = id => { let x = 0; for (const ch of String(id)) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return COLOR_POOL[x % COLOR_POOL.length]; };

function subscribe() {
  const confirmed = { projects: false, clients: false, notes: false, slots: false };
  S.confirmed = confirmed;
  let live = false;
  const timer = setTimeout(() => { if (!live) setSync(S.loaded.projects ? 'stale' : 'error'); if (!S.loaded.projects) banner('Die Daten sind gerade nicht erreichbar. Prüfe die Internetverbindung; die App verbindet sich weiter im Hintergrund.', true); }, 10000);
  const done = () => { if (!live && confirmed.projects && confirmed.clients && confirmed.notes && confirmed.slots) { live = true; clearTimeout(timer); setSync('live'); banner(null); } };
  const onErr = err => { clearTimeout(timer); console.error(err); setSync('error'); if (err && err.code === 'revoked') banner('Dein Zugang wurde entzogen oder ist abgelaufen. Melde dich neu an.', true); else banner('Die Live-Verbindung ist abgebrochen. Lade die Seite neu, um wieder zu verbinden.', true); };
  const sub = (name, map) => S.db.collection(name).onSnapshot(snap => {
    map.clear();
    for (const d of snap.docs) { const v = d.data(); if (v) map.set(d.id, { ...v, id: d.id }); }
    S.loaded[name] = true;
    if (!snap.metadata.fromCache) { confirmed[name] = true; done(); }
    if (name === 'projects' || name === 'clients') migrateClients();
    queueRender();
  }, onErr);
  sub('clients', S.clients);
  sub('projects', S.projects);
  sub('notes', S.notes);
  sub('slots', S.slots);
  S.db.collection('team').onSnapshot(snap => {
    S.teamData = new Map(snap.docs.map(d => [d.id, d.data() || {}]));
    S.team = new Set(S.teamData.keys()); queueRender();
  }, err => console.warn('team', err));
  if (S.isAdmin) S.db.collection('allowed').onSnapshot(snap => {
    S.allowed = snap.docs.map(d => ({ email: d.id, ...(d.data() || {}) })).sort((a, b) => a.email.localeCompare(b.email));
    if (S.teamDialogOpen) drawTeamDialog();
  }, err => console.warn('allowed', err));
}
async function registerMe(u) {
  const ref = S.db.collection('team').doc(u.uid);
  const snap = await ref.get().catch(() => null);
  const name = (snap && snap.exists && snap.data().name) || u.displayName || u.email.split('@')[0];
  const body = { name, email: u.email.toLowerCase(), color: colorFor(u.uid) };
  if (!snap || !snap.exists || snap.data().name !== body.name || snap.data().email !== body.email) {
    await ref.set({ ...body, since: (snap && snap.exists && snap.data().since) || Date.now() }).catch(e => console.warn(e));
  }
}

  if (!member) { authScreen('blocked'); return; }
  hideAuth();
  if (started) return;
  started = true;
  S.me = u.uid; S.isAdmin = admin; S.canWrite = true; S.writeKnown = true; S.initDone = true;
  S.db = makeDb(FB.fs);
  S.user = null;
  $('#team-btn').hidden = !admin;
  applyWriteMode();
  await registerMe(u);
  subscribe();
  setInterval(() => { if (S.view === 'day' && ymd(S.day) === ymd(today())) queueRender(); }, 60000);
}

/* ---------- Team & Einladungen (nur Admin) ---------- */
function drawTeamDialog() {
  const body = $('#modal-body'); if (!body || !S.teamDialogOpen) return;
  const byEmail = new Map([...(S.teamData || new Map()).entries()].map(([id, d]) => [d.email, id]));
  const list = h('div', { class: 'invite-list' }, (S.allowed || []).map(a => {
    const uid = byEmail.get(a.email);
    return h('div', { class: 'invite-row' },
      uid ? avatar(uid, 'sm') : h('span', { class: 'av sm', '--c': '#8a9894', text: '?' }),
      h('div', { class: 'invite-who' }, h('b', { text: uid ? nameOf(uid) : 'Noch nicht angemeldet' }), h('span', { text: a.email })),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': `${a.email} entfernen`, title: 'Zugang entziehen', onclick: async () => {
        try { await deleteDoc(fsDoc(FB.fs, 'allowed', a.email)); toast(`${a.email} hat keinen Zugang mehr`); } catch (e) { toast('Entfernen hat nicht geklappt.', true); }
      } }, svg(ICON.x)));
  }));
  const inp = h('input', { type: 'email', id: 'inv-email', placeholder: 'name@beispiel.de', autocomplete: 'off' });
  const add = async () => {
    const v = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast('Bitte eine gültige E-Mail-Adresse eingeben.', true); inp.focus(); return; }
    try { await setDoc(fsDoc(FB.fs, 'allowed', v), { addedAt: Date.now(), addedBy: S.me }); inp.value = ''; toast(`${v} eingeladen`); } catch (e) { toast('Einladen hat nicht geklappt.', true); }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  body.replaceChildren(h('div', { class: 'form' },
    h('p', { style: 'margin:0', text: 'Nur diese Adressen können ein Konto einrichten und das Board nutzen. Schick der Person nach dem Einladen den Link zur App; dort wählt sie „Eingeladen? Konto einrichten“.' }),
    h('div', { class: 'lbl' }, 'Person einladen', h('div', { style: 'display:flex;gap:8px' }, inp, h('button', { class: 'btn primary', type: 'button', onclick: add }, 'Einladen'))),
    h('div', { class: 'lbl' }, `Freigeschaltet (${(S.allowed || []).length})`, (S.allowed || []).length ? list : h('p', { class: 'hint', style: 'margin:0', text: 'Noch niemand eingeladen. Du selbst hast als Admin immer Zugang.' }))));
}
function openTeamDialog() {
  S.teamDialogOpen = true;
  openModal('Team & Einladungen', h('div'), [h('button', { class: 'btn', type: 'button', onclick: closeModal }, 'Schließen')]);
  const prevClose = modalClose; modalClose = () => { S.teamDialogOpen = false; prevClose(); };
  drawTeamDialog();
}

async function init() {
  bindStatic();
  applyHash();
  document.body.classList.add('readonly');
  render();
  $('#team-btn').addEventListener('click', openTeamDialog);
  $('#logout-btn').addEventListener('click', async () => { await signOut(FB.auth); location.reload(); });
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || /DEIN|YOUR/.test(FIREBASE_CONFIG.apiKey)) { authScreen('config'); return; }
  FB.app = initializeApp(FIREBASE_CONFIG);
  FB.auth = getAuth(FB.app);
  FB.fs = getFirestore(FB.app);
  authScreen('loading');
  onAuthStateChanged(FB.auth, u => { if (!u && started) { location.reload(); return; } onUser(u); });
}
init();
})();
</script>
</body>
